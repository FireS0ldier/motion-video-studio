<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 390px; height: 844px; padding: 64px 18px 24px; display: flex; flex-direction: column; gap: 16px; background: radial-gradient(120% 60% at 50% 0%, #17132e 0%, #0a0c12 60%); }
      .top { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
      .top img { width: 28px; }
      .top .chip { margin-left: auto; }
      .bubble { align-self: flex-end; max-width: 82%; background: #7c5cff; padding: 13px 15px; border-radius: 18px 18px 4px 18px; font-size: 15.5px; line-height: 1.38; font-weight: 500; }
      .answer { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .answer .h { font-size: 13px; color: var(--teal); font-weight: 650; display: flex; align-items: center; gap: 6px; }
      .answer p { font-size: 16px; line-height: 1.4; }
      .bars { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 8px; }
      .bars div { flex: 1; border-radius: 8px 8px 3px 3px; background: #2a2f44; position: relative; }
      .bars div.hot { background: linear-gradient(180deg, #ff5d73, #ffb547); }
      .bars span { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); }
      .input { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); font-size: 15px; }
      .input .send { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; background: #7c5cff; display: grid; place-items: center; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .caret { display: inline-block; width: 2px; height: 18px; background: var(--teal); vertical-align: -3px; margin-left: 1px; }
      .btn { display: flex; gap: 8px; }
      .btn div { flex: 1; text-align: center; padding: 11px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
      .btn div.primary { background: #7c5cff; border-color: #7c5cff; }
      .sheet { margin-top: auto; padding: 18px; border-radius: 22px; background: #161a26; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
      .link { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #0d1018; font-family: 'JBM', monospace; font-size: 14px; }
      .ok { margin-left: auto; color: var(--green); font-family: Inter; font-weight: 650; font-size: 13px; }
      .avs { display: flex; gap: 14px; }
      .avs div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .avs i { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; color: #fff; font-size: 15px; }
      .mini { padding: 12px; display: flex; gap: 12px; align-items: center; }
      .mini .bars { height: 60px; width: 120px; gap: 5px; padding: 0; }
      .mini .bars div { border-radius: 3px; }
    </style>
  </head>
  <body>
    <div class="top"><img src="../assets/brand/mark.svg" />Ask Orbit<span class="chip">⚡ Live data</span></div>
    <div id="screen"></div>
    <script>
      const bars = (hot) =>
        `<div class="bars">${[['Sign up', 100], ['Profile', 82], ['Connect', 44], ['Invite', 37], ['Paid', 21]]
          .map(([l, v], i) => `<div class="${i === hot ? 'hot' : ''}" style="height:${v}%"><span>${l}</span></div>`)
          .join('')}</div>`
      const screens = {
        ask: `<div class="muted" style="font-size:14px">Try asking</div>
          <div class="chips"><span class="chip">Weekly active users by plan</span><span class="chip">Why did signups dip?</span><span class="chip">Top events today</span></div>
          <div class="input" style="margin-top:420px">Which onboarding step loses the most users?<span class="caret"></span><span class="send">➤</span></div>`,
        answer: `<div class="bubble">Which onboarding step loses the most users?</div>
          <div class="card answer"><div class="h">◆ Orbit · answered in 0.8 s</div>
          <p><b>Connect data</b> loses the most users: <b style="color:#ff8a7a">−38%</b> between Profile and Connect.</p>
          ${bars(2)}<div style="height:14px"></div>
          <div class="btn"><div>Open in workspace</div><div class="primary">Share</div></div></div>`,
        share: `<div class="bubble">Which onboarding step loses the most users?</div>
          <div class="card mini">${bars(2)}<div><b style="font-size:14px">Onboarding drop-off</b><div class="muted" style="font-size:12px;margin-top:4px">Connect data · −38%</div></div></div>
          <div class="sheet"><b style="font-size:17px">Share insight</b>
          <div class="link">orbit.dev/i/7Kq2<span class="ok">✓ Copied</span></div>
          <div class="avs"><div><i style="background:#7c5cff">MK</i>Maya</div><div><i style="background:#2ea8e6">JL</i>Jonas</div><div><i style="background:#e65c8a">SA</i>Sara</div><div><i style="background:#3ddc97">TR</i>Tom</div></div>
          <div class="btn"><div>Slack</div><div>Email</div><div class="primary">Done</div></div></div>`,
      }
      document.getElementById('screen').outerHTML = `<div style="display:flex;flex-direction:column;gap:16px;flex:1">${screens[new URLSearchParams(location.search).get('s') || 'ask']}</div>`
    </script>
  </body>
</html>
